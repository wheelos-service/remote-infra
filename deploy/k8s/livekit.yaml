apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: default
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
        - ""
    rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 60000
        use_external_ip: true
        enable_loopback_candidate: false
    keys:
        # Will be merged or mapped if using environment vars
        devkey: secret
    redis:
        address: redis:6379
        username: ""
        password: ""
        db: 0
    logging:
        json: false
        level: info

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: default
  labels:
    app: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      # CRITICAL: Allow LiveKit to bind directly to host network interface
      # to enable zero-overhead UDP hole punching for low-latency video paths.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
      - name: livekit
        image: livekit/livekit-server:latest
        args: ["--config", "/etc/livekit.yaml"]
        # In hostNetwork mode, container ports are automatically mapped to host.
        # But we still declare them for documentation.
        ports:
        - containerPort: 7880
          name: http
        - containerPort: 7881
          name: rtc-tcp

        env:
        - name: LIVEKIT_KEYS
          valueFrom:
            secretKeyRef:
              name: teleop-secrets
              key: LIVEKIT_API_KEY
              # Note: LiveKit expects "key: secret", in prod use a proper generator

        volumeMounts:
        - name: config
          mountPath: /etc/livekit.yaml
          subPath: livekit.yaml

        resources:
          requests:
            cpu: "2"
            memory: "1Gi"
          limits:
            cpu: "8"
            memory: "4Gi"

      volumes:
      - name: config
        configMap:
          name: livekit-config

---
# Optional Service for internal lookups, although hostNetwork simplifies this
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: default
spec:
  selector:
    app: livekit
  ports:
  - port: 7880
    targetPort: 7880
    name: http
