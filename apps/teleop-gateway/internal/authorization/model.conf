[request_definition]
r = sub, dom, vehicle, act, active_member

[policy_definition]
p = dom, grant, role, act, scope, vehicle

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p_eft == allow))

[matchers]
m = r.act == p.act && ((r.active_member == true && p.grant == "active-member") || (r.dom == p.dom && g(r.sub, p.grant, r.dom) && ((p.scope == "all" && p.vehicle == "*") || (p.scope == "selected" && p.vehicle == r.vehicle))))
