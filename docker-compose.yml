services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8000}:80"
    volumes:
      - ${FRONTEND_CONFIG_PATH:-./frontend/public/runtime-config.js}:/usr/share/nginx/html/runtime-config.js:ro
      - ${FRONTEND_MAPS_PATH:-./frontend/public/maps}:/usr/share/nginx/html/maps:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  casdoor-db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: "${CASDOOR_DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: casdoor
    volumes:
      - casdoor-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  casdoor:
    image: casbin/casdoor:v4.25.0
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - casdoor-config:/conf:ro
    depends_on:
      casdoor-db:
        condition: service_healthy
      casdoor-config-init:
        condition: service_completed_successfully

  casdoor-config-init:
    image: python:3.12-alpine
    restart: "no"
    environment:
      CASDOOR_DB_ROOT_PASSWORD: "${CASDOOR_DB_ROOT_PASSWORD:?set a Casdoor database password}"
      CASDOOR_DOMAIN: "${CASDOOR_DOMAIN:-casdoor.example.com}"
    command: ["python3", "/render-config.py", "casdoor", "/template/app.conf", "/generated/app.conf"]
    volumes:
      - ./infra/scripts/render-config.py:/render-config.py:ro
      - ./infra/local-dev/casdoor/app.conf:/template/app.conf:ro
      - casdoor-config:/generated

  livekit-config:
    image: python:3.12-alpine
    restart: "no"
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set a LiveKit API key}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set a LiveKit API secret}"
    command: ["python3", "/render-config.py", "livekit", "/template/livekit.yaml", "/generated/livekit.yaml"]
    volumes:
      - ./infra/scripts/render-config.py:/render-config.py:ro
      - ./infra/local-dev/livekit.template.yaml:/template/livekit.yaml:ro
      - livekit-config:/generated

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - livekit-config:/etc
    depends_on:
      redis:
        condition: service_started
      livekit-config:
        condition: service_completed_successfully

  teleop-backend:
    build:
      context: ./apps/teleop-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_URL: "http://livekit:7880"
      REDIS_URL: "redis:6379"
      CONTROL_LEASE_TTL_SECONDS: "${CONTROL_LEASE_TTL_SECONDS:-30}"
      VEHICLE_LIVEKIT_TOKEN_TTL_MINUTES: "${VEHICLE_LIVEKIT_TOKEN_TTL_MINUTES:-30}"
      AUTH_MODE: "${AUTH_MODE:-dev}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      AUTHORIZATION_POLICY_FILE: "${AUTHORIZATION_POLICY_FILE:-}"
      VEHICLE_ACL_JSON: "${VEHICLE_ACL_JSON:-}"
      VEHICLE_SUBJECT_MAP_JSON: "${VEHICLE_SUBJECT_MAP_JSON:-}"
      VEHICLE_REGISTRY_JSON: "${VEHICLE_REGISTRY_JSON:-}"
      CONTROL_HANDOVER_ACK_ENABLED: "${CONTROL_HANDOVER_ACK_ENABLED:-false}"
      SIMULATED_CONTROL_VEHICLES_JSON: "${SIMULATED_CONTROL_VEHICLES_JSON:-[]}"
      OPERATIONS_DB_PATH: "/var/lib/teleop/operations.db"
      ALLOWED_ORIGINS: "${CLIENT_ORIGIN:-http://localhost:8000}"
    volumes:
      - operations-data:/var/lib/teleop
      - ${AUTHORIZATION_POLICY_DIR:-./infra/local-dev/authorization-policy}:/etc/teleop-auth:ro
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["cloud"]
    restart: unless-stopped
    environment:
      API_DOMAIN: "${API_DOMAIN:-api.example.com}"
      RTC_DOMAIN: "${RTC_DOMAIN:-rtc.example.com}"
      RTC_UPSTREAM: "${RTC_UPSTREAM:-livekit:7880}"
      CASDOOR_DOMAIN: "${CASDOOR_DOMAIN:-casdoor.example.com}"
      CASDOOR_UPSTREAM: "${CASDOOR_UPSTREAM:-casdoor:8000}"
      CLIENT_DOMAIN: "${CLIENT_DOMAIN:-client.example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/local-dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - teleop-backend
      - livekit
      - casdoor
      - frontend

volumes:
  livekit-config:
  caddy-data:
  caddy-config:
  casdoor-db:
  casdoor-config:
  operations-data:
  redis-data:
