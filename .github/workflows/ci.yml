name: Component checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/teleop-shared/package-lock.json
            apps/operator-console/package-lock.json
      - run: |
          npm ci --prefix packages/teleop-shared
          npm ci --prefix frontend
          npm ci --prefix apps/operator-console
          npm --prefix packages/teleop-shared test
          npm --prefix frontend run build
          npm --prefix frontend test
          npm --prefix apps/operator-console test
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -f frontend/Dockerfile -t teleop-frontend:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: frontend/dist
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/teleop-gateway/go.mod
          cache-dependency-path: apps/teleop-gateway/go.sum
      - working-directory: apps/teleop-gateway
        run: |
          go test ./...
          go build -mod=readonly ./cmd/teleop-gateway
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libjsoncpp-dev libcurl4-openssl-dev libssl-dev libsqlite3-dev
          cmake -S apps/vehicle-edge-cpp -B apps/vehicle-edge-cpp/build -DEDGE_ENABLE_LIVEKIT=OFF
          cmake --build apps/vehicle-edge-cpp/build -j 2
          ctest --test-dir apps/vehicle-edge-cpp/build --output-on-failure
