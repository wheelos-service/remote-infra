# Opt-in, single-Gateway manual-provisioning pilot. Never use with real actuation.
# Set both variables in a protected .env; URL-encode the DSN password.
services:
  livekit:
    image: livekit/livekit-server:v1.13.11

  authorization-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teleop_authorization
      POSTGRES_USER: teleop_authorization
      POSTGRES_PASSWORD: "${AUTHORIZATION_POSTGRES_PASSWORD:?set a dedicated authorization database password}"
    volumes:
      - authorization-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teleop_authorization -d teleop_authorization"]
      interval: 5s
      timeout: 3s
      retries: 20

  teleop-backend:
    environment:
      AUTH_MODE: oidc
      AUTHORIZATION_MODE: managed
      AUTHORIZATION_DATABASE_URL: "${AUTHORIZATION_DATABASE_URL:?set the authorization PostgreSQL URL}"
      AUTHORIZATION_MANAGED_MAINTENANCE: "${AUTHORIZATION_MANAGED_MAINTENANCE:-false}"
      AUTHORIZATION_ONBOARDING_CONFIG_FILE: "${AUTHORIZATION_ONBOARDING_CONFIG_FILE:-}"
      AUTHORIZATION_LIVEKIT_SERVER_VERSION: "v1.13.11"
      AUTHORIZATION_LIVEKIT_INGRESS_GATED: "true"
      AUTHORIZATION_POLICY_FILE: ""
      VEHICLE_REGISTRY_JSON: ""
      VEHICLE_SUBJECT_MAP_JSON: ""
      VEHICLE_ACL_JSON: ""
      CONTROL_HANDOVER_ACK_ENABLED: "false"
    depends_on:
      authorization-db:
        condition: service_healthy

  caddy:
    environment:
      RTC_UPSTREAM: "teleop-backend:8080"

volumes:
  authorization-data:
