<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Operator Console — 远控操作台</title>
    <!-- LiveKit CDN -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <!-- TweetNaCl for Ed25519 -->
    <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .dashboard { display: none; width: 100%; max-width: 1000px; flex-direction: column; align-items: center; }
        #video-container { width: 800px; height: 450px; background: #000; position: relative; border: 2px solid #444; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .hud-overlay { position: absolute; top: 10px; left: 10px; color: #00ff00; font-family: monospace; font-size: 14px; text-shadow: 1px 1px 2px black; pointer-events: none; }
        .controls { display: flex; gap: 15px; margin-top: 20px; width: 800px; justify-content: center; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        button { padding: 12px 24px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-connect { background: #0d6efd; color: white; }
        .btn-steer { background: #444; color: white; }
        .btn-brake { background: #dc3545; color: white; }
        .alert-box { margin-top: 15px; padding: 10px 20px; border-radius: 4px; display: none; width: 800px; text-align: center; }
        .alert-shadow { background: #ffc107; color: #000; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚚 远控车队 — Operator Console</h2>
        <div>
            <span id="user-info" style="margin-right: 15px;">未登录</span>
            <button id="auth-btn" onclick="handleAuth()">登录</button>
        </div>
    </div>

    <!-- 登录面板 -->
    <div id="login-panel" style="display: none; text-align: center; margin-top: 80px; max-width: 400px; margin-left: auto; margin-right: auto;">
        <h3 style="margin-bottom: 30px;">🔐 操作员登录</h3>
        <div style="margin-bottom: 15px;">
            <input type="text" id="login-name" placeholder="用户名 (如: operator-1)" value="operator-1"
                style="padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <input type="text" id="login-org" placeholder="组织 (如: fleet-a)" value="fleet-a"
                style="padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 20px;">
            <select id="login-role" style="padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box;">
                <option value="operator">operator (操作员)</option>
                <option value="admin">admin (管理员 - 可抢占)</option>
            </select>
        </div>
        <button onclick="doLogin()" class="btn-connect" style="padding: 12px 40px; font-size: 16px;">进入系统</button>
    </div>

    <div id="welcome-screen" style="text-align: center; margin-top: 100px;">
        <h3>请登录以接管车辆</h3>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="controls" style="margin-bottom: 15px;">
            <input type="text" id="target-vehicle" placeholder="输入车辆ID (如: car-001)" value="car-001" style="padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: white;">
            <button class="btn-connect" id="connect-btn" onclick="startTeleop()">申请接管</button>
        </div>

        <div id="alert-banner" class="alert-box"></div>

        <div id="video-container">
            <div class="hud-overlay" id="hud">STATE: OFFLINE<br>LATENCY: -- ms</div>
        </div>

        <div class="controls">
            <button class="btn-steer ctrl-btn" onmousedown="sendCommand('steer', -100)" onmouseup="sendCommand('steer', 0)">◀ 左转</button>
            <button class="btn-steer ctrl-btn" onmousedown="sendCommand('steer', 100)" onmouseup="sendCommand('steer', 0)">右转 ▶</button>
            <button class="btn-brake ctrl-btn" onclick="sendCommand('brake', 100)">🛑 紧急制动</button>
        </div>
    </div>

    <script>
        'use strict';

        // ==================== 工具函数 ====================
        function uint8ArrayToBase64(arr) {
            let binary = "";
            const chunkSize = 0x8000;
            for (let i = 0; i < arr.length; i += chunkSize) {
                const chunk = arr.subarray(i, Math.min(i + chunkSize, arr.length));
                binary += String.fromCharCode(...chunk);
            }
            return btoa(binary);
        }

        function base64ToUint8Array(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        function randomKeyId() {
            return `kid-${Date.now()}-${Math.floor(Math.random() * 1e9)}`;
        }

        function buildSignMessage(payload) {
            return `${payload.vehicle_id}|${payload.key_id}|${payload.cmd}|${payload.val}|${payload.seq}|${payload.ts}`;
        }

        // ==================== 安全控制发送器 (使用 TweetNaCl) ====================
        class SecureControlSender {
            constructor({ gatewayBaseUrl, vehicleId, operatorId, authToken }) {
                this.gatewayBaseUrl = gatewayBaseUrl.replace(/\/$/, "");
                this.vehicleId = vehicleId;
                this.operatorId = operatorId;
                this.authToken = authToken;
                this.seq = 0;
                this.keyId = null;
                this.keyPair = null;
                this.publicKeyB64 = null;
                this.dataChannel = null;
            }

            initEphemeralKey() {
                // 使用 TweetNaCl 生成 Ed25519 密钥对
                this.keyPair = nacl.sign.keyPair();
                this.publicKeyB64 = uint8ArrayToBase64(this.keyPair.publicKey);
                this.keyId = randomKeyId();
                return Promise.resolve();
            }

            async registerPublicKey(expiresInMs = 2 * 60 * 60 * 1000) {
                if (!this.keyPair || !this.publicKeyB64 || !this.keyId) {
                    this.initEphemeralKey();
                }

                const body = {
                    vehicle_id: this.vehicleId,
                    operator_id: this.operatorId,
                    key_id: this.keyId,
                    public_key_b64: this.publicKeyB64,
                    expires_at_ms: Date.now() + expiresInMs,
                };

                const resp = await fetch(`${this.gatewayBaseUrl}/api/keys/register`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${this.authToken}`,
                    },
                    body: JSON.stringify(body),
                });

                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error(`registerPublicKey failed: ${resp.status} ${text}`);
                }

                return await resp.json();
            }

            setLocalParticipant(localParticipant) {
                this.localParticipant = localParticipant;
            }

            sendCommand(cmd, val) {
                if (!this.keyPair || !this.keyId) {
                    throw new Error("SecureControlSender not initialized. Call registerPublicKey first.");
                }
                if (!this.localParticipant) {
                    throw new Error("LocalParticipant is not set.");
                }

                this.seq += 1;
                const payload = {
                    vehicle_id: this.vehicleId,
                    key_id: this.keyId,
                    cmd,
                    val,
                    seq: this.seq,
                    ts: Date.now(),
                };

                const signMsg = buildSignMessage(payload);
                const messageBytes = new TextEncoder().encode(signMsg);
                const signatureBytes = nacl.sign.detached(messageBytes, this.keyPair.secretKey);
                const sig = uint8ArrayToBase64(signatureBytes);

                const packet = {
                    ...payload,
                    sig,
                    alg: "Ed25519",
                };

                // 使用 LiveKit 的 publishData 发送数据
                const encoder = new TextEncoder();
                this.localParticipant.publishData(encoder.encode(JSON.stringify(packet)), { reliable: false });
                console.log('发送签名指令:', packet);
                return packet;
            }
        }

        // ==================== 应用逻辑 ====================
        // Runtime configuration via URL query parameters.
        const params = new URLSearchParams(window.location.search);
        const GO_BACKEND_URL = params.get('backend') || 'http://teleop.wheelos.cn';
        const LIVEKIT_URL = params.get('livekit') || (() => {
            // 自动检测：如果是 teleop.wheelos.cn，使用对应的 LiveKit 地址
            if (window.location.hostname === 'teleop.wheelos.cn') {
                return 'ws://teleop.wheelos.cn';
            }
            return 'ws://localhost:7880';
        })();

        let currentRoom = null;
        let isShadowMode = false;
        let currentUser = null;
        let secureSender = null;

        window.onload = () => {
            checkLoginState();
        };

        function checkLoginState() {
            const userJson = localStorage.getItem('teleop_user');
            if (userJson) {
                currentUser = JSON.parse(userJson);
                document.getElementById('user-info').innerText = `操作员: ${currentUser.name} (${currentUser.role})`;
                document.getElementById('auth-btn').innerText = '退出';
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
            } else {
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('login-panel').style.display = 'block';
                document.getElementById('welcome-screen').style.display = 'none';
            }
        }

        function handleAuth() {
            if (currentUser) {
                localStorage.removeItem('teleop_user');
                currentUser = null;
                location.reload();
            } else {
                document.getElementById('login-panel').style.display = 'block';
                document.getElementById('welcome-screen').style.display = 'none';
            }
        }

        function doLogin() {
            const name = document.getElementById('login-name').value.trim();
            const org = document.getElementById('login-org').value.trim();
            const role = document.getElementById('login-role').value;

            if (!name || !org) {
                alert('请填写完整的登录信息');
                return;
            }

            const token = `${name}|${org}|${role}`;
            currentUser = { name, org, role, token };
            localStorage.setItem('teleop_user', JSON.stringify(currentUser));
            checkLoginState();
        }

        async function startTeleop() {
            if (!currentUser) {
                alert('请先登录');
                handleAuth();
                return;
            }

            const token = currentUser.token;
            const vid = document.getElementById('target-vehicle').value;
            const hud = document.getElementById('hud');
            const alertBanner = document.getElementById('alert-banner');

            try {
                hud.innerHTML = 'STATE: AUTHENTICATING...';
                const response = await fetch(`${GO_BACKEND_URL}/api/token/operator?vid=${encodeURIComponent(vid)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error(await response.text());
                const data = await response.json();
                isShadowMode = (data.mode === 'shadow');
                alertBanner.innerText = data.msg || '';
                alertBanner.style.display = 'block';
                alertBanner.className = isShadowMode ? 'alert-box alert-shadow' : 'alert-box';
                document.querySelectorAll('.ctrl-btn').forEach(btn => btn.disabled = isShadowMode);

                hud.innerHTML = 'STATE: CONNECTING WEBRTC...';
                currentRoom = new LivekitClient.Room();

                currentRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    console.log('Track subscribed:', track.kind, 'from', participant?.identity);
                    if (track.kind === 'video') {
                        try {
                            const element = track.attach();
                            if (!element || !(element instanceof HTMLElement)) {
                                console.error('track.attach() did not return a valid element:', element);
                                return;
                            }
                            const container = document.getElementById('video-container');
                            // 保存 HUD 引用
                            const hudElement = document.getElementById('hud');
                            // 清空容器
                            container.innerHTML = '';
                            // 重新添加 HUD
                            if (hudElement) container.appendChild(hudElement);
                            // 添加视频元素
                            container.appendChild(element);
                            hudElement.innerHTML = `STATE: ${isShadowMode ? 'SHADOW (READ-ONLY)' : 'DRIVING'}<br>VID: ${vid}`;
                        } catch (e) {
                            console.error('Error attaching video track:', e);
                        }
                    }
                });

                // 监听轨道发布事件，用于调试
                currentRoom.on(LivekitClient.RoomEvent.TrackPublished, (publication, participant) => {
                    console.log('Track published:', publication.kind, 'from', participant?.identity);
                });

                // 监听参与者连接
                currentRoom.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
                    console.log('Participant connected:', participant.identity);
                    // 列出该参与者的轨道
                    for (const [sid, publication] of Object.entries(participant.trackPublications || {})) {
                        console.log('  - track:', sid, publication);
                    }
                });

                // DataChannel 就绪时设置安全发送器
                currentRoom.on(LivekitClient.RoomEvent.DataPacketReceived, (payload, participant) => {
                    // 可以在这里接收车辆返回的遥测数据
                    console.log('收到数据包:', payload);
                });

                await currentRoom.connect(LIVEKIT_URL, data.token);

                // 初始化安全控制发送器
                secureSender = new SecureControlSender({
                    gatewayBaseUrl: GO_BACKEND_URL,
                    vehicleId: vid,
                    operatorId: currentUser.name,
                    authToken: token
                });

                // 设置 LocalParticipant
                if (currentRoom.localParticipant) {
                    secureSender.setLocalParticipant(currentRoom.localParticipant);
                }

                // 注册公钥
                if (!isShadowMode) {
                    try {
                        await secureSender.registerPublicKey();
                        console.log('公钥注册成功');
                    } catch (e) {
                        console.error('公钥注册失败:', e);
                        alert('公钥注册失败: ' + e.message);
                    }
                }

                document.getElementById('connect-btn').disabled = true;
                hud.innerHTML = `STATE: ${isShadowMode ? 'SHADOW (READ-ONLY)' : 'DRIVING'}<br>VID: ${vid}`;
            } catch (e) {
                console.error('接管失败:', e);
                hud.innerHTML = 'STATE: ERROR';
                alert('接管失败: ' + e.message);
            }
        }

        function sendCommand(cmd, value) {
            if (isShadowMode || !secureSender) {
                console.log('无法发送指令:', isShadowMode ? '影子模式' : '未初始化');
                return;
            }
            try {
                secureSender.sendCommand(cmd, value);
            } catch (e) {
                console.error('发送指令失败:', e);
            }
        }
    </script>
</body>
</html>
