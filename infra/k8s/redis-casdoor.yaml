apiVersion: v1
kind: Secret
metadata:
  name: teleop-secrets
  namespace: default
type: Opaque
stringData:
  LIVEKIT_API_KEY: "devkey"
  LIVEKIT_API_SECRET: "secret"
  OIDC_ISSUER: "https://issuer.example.com/"
  OIDC_AUDIENCE: "teleop-api"
  OIDC_JWKS_URL: "https://issuer.example.com/.well-known/jwks.json"
  VEHICLE_ACL_JSON: '[{"user_id":"operator-001","tenant_id":"fleet-a","vehicle_id":"vehicle-001","permissions":["observe","control"]}]'
  CASDOOR_DB_USER: "root"
  CASDOOR_DB_PASSWORD: "password"
  TURN_SECRET: "my-super-secret-turn-key"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
  namespace: default
  labels:
    app: casdoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casdoor
  template:
    metadata:
      labels:
        app: casdoor
    spec:
      containers:
      - name: casdoor
        image: casdoor/casdoor:latest
        ports:
        - containerPort: 8000
        env:
        - name: TZ
          value: "UTC"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: casdoor
  namespace: default
spec:
  selector:
    app: casdoor
  ports:
  - port: 8000
    targetPort: 8000
    name: http
