apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: default
data:
  turnserver.conf: |
    # Listening ports.
    listening-port=3478
    tls-listening-port=5349

    # Public address exposed by the host.
    # external-ip=YOUR_EXTERNAL_IP

    # Required WebRTC realm.
    realm=teleop.local

    # Enable REST API short-lived credential authentication.
    use-auth-secret

    # Inject the secret through deployment arguments rather than this ConfigMap.
    # static-auth-secret=my-super-secret-turn-key

    total-quota=100
    stale-nonce
    no-multicast-peers

    # Disable insecure protocol versions when supported by the image.
    # no-tlsv1
    # no-tlsv1_1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: default
  labels:
    app: coturn
spec:
  # Use multiple replicas and availability zones for production high availability.
  replicas: 2
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      # hostNetwork supports NAT traversal and avoids iptables MASQUERADE overhead.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Tune UDP/TCP socket buffers for high-bitrate, low-latency stream stability.
      initContainers:
      - name: sysctl-tuning
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          sysctl -w net.core.rmem_max=26214400
          sysctl -w net.core.wmem_max=26214400
          sysctl -w net.core.rmem_default=26214400
          sysctl -w net.core.wmem_default=26214400
        securityContext:
          privileged: true

      containers:
      - name: coturn
        image: coturn/coturn:latest
        args:
          - "-c"
          - "/etc/coturn/turnserver.conf"
          # Read the authentication secret from Kubernetes Secret.
          - "--static-auth-secret=$(TURN_SECRET)"
        ports:
        - containerPort: 3478
          protocol: UDP
        - containerPort: 3478
          protocol: TCP
        env:
        - name: TURN_SECRET
          valueFrom:
            secretKeyRef:
              name: teleop-secrets
              key: TURN_SECRET
        volumeMounts:
        - name: config
          mountPath: /etc/coturn
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "1Gi"

      volumes:
      - name: config
        configMap:
          name: coturn-config
